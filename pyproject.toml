[project]
name = "openai-imagegen-mcp"
version = "0.1.0"
description = "MCP server for image generation and editing using OpenAI gpt-image-1.5"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "openai>=1.60",
    "pydantic-settings[dotenv]>=2.0",
]

[project.scripts]
openai-imagegen-mcp = "openai_imagegen_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_imagegen_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
