# Publishing runs on a published GitHub release, never on a tag push, so a tag
# pushed by mistake cannot ship a version to PyPI.
#
# Credentials: none. PyPI is configured with a trusted publisher pointing at this
# repository, this workflow file and the "pypi" environment below, and the upload
# is authorised by the OIDC token minted by `id-token: write`.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match version $packaged in pyproject.toml"
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-gpt-image
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
